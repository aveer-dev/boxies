name: Inboxies
options:
  bundleIdPrefix: co.inboxies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: B6X6773H7F
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
    GCC_WARN_ABOUT_RETURN_TYPE: true
    GCC_WARN_UNINITIALIZED_AUTOS: true
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
  configs:
    Release:
      VALIDATE_PRODUCT: true
settingGroups:
  # iPhone + iPad (AVE-71). iPhone stays portrait-only via Info.plist; iPad gets every
  # orientation and multitasking (Split View / Slide Over), so UIRequiresFullScreen stays unset.
  deviceTarget:
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: false
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.6
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.2.0
targets:
  Inboxies:
    type: application
    platform: iOS
    sources:
      - path: Inboxies
    dependencies:
      - package: SwiftSoup
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: InboxiesCredentialProvider
    settings:
      groups:
        - deviceTarget
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.inboxies.app
        INFOPLIST_FILE: Inboxies/Info.plist
        CODE_SIGN_ENTITLEMENTS: Inboxies/Inboxies.entitlements
        # The application preset uses the legacy "iPhone Developer" identity.
        CODE_SIGN_IDENTITY: Apple Development
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Inboxies
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_TESTABILITY: true
        # Google Sign-In (Firebase project inboxies-app). OAuth client ids are public.
        # The iOS client signs in; the Web client is the ID token audience the Worker
        # checks (GOOGLE_CLIENT_ID). Info.plist reads these.
        GOOGLE_IOS_CLIENT_ID: 958946711798-fvtno41jorj97frv61ig4uhb0d0486rd.apps.googleusercontent.com
        GOOGLE_IOS_REVERSED_CLIENT_ID: com.googleusercontent.apps.958946711798-fvtno41jorj97frv61ig4uhb0d0486rd
        GOOGLE_SERVER_CLIENT_ID: 958946711798-21t2gjrqodotju01isg9k58gtme6bko0.apps.googleusercontent.com
  InboxiesCredentialProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: InboxiesCredentialProvider
      # Shared with the app: session handoff, API origin, design tokens, Inter.
      - path: Inboxies/Shared
      - path: Inboxies/Config/AppConfig.swift
      - path: Inboxies/Theme/AppTheme.swift
      - path: Inboxies/Theme/LiquidGlass.swift
      - path: Inboxies/Fonts
        buildPhase: resources
    settings:
      groups:
        - deviceTarget
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.inboxies.app.credential-provider
        INFOPLIST_FILE: InboxiesCredentialProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: InboxiesCredentialProvider/InboxiesCredentialProvider.entitlements
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        SWIFT_EMIT_LOC_STRINGS: true
  InboxiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InboxiesTests
    dependencies:
      - target: Inboxies
    settings:
      groups:
        - deviceTarget
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.inboxies.InboxiesTests
        PRODUCT_MODULE_NAME: InboxiesTests
        GENERATE_INFOPLIST_FILE: true
        CLANG_ENABLE_OBJC_WEAK: false
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Inboxies.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Inboxies"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Inboxies:
    build:
      targets:
        Inboxies: all
        InboxiesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InboxiesTests
