name: Inboxies
options:
  bundleIdPrefix: co.inboxies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: B6X6773H7F
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.6
targets:
  Inboxies:
    type: application
    platform: iOS
    sources:
      - path: Inboxies
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.inboxies.app
        INFOPLIST_FILE: Inboxies/Info.plist
        CODE_SIGN_ENTITLEMENTS: Inboxies/Inboxies.entitlements
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: Inboxies
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
  InboxiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InboxiesTests
    dependencies:
      - target: Inboxies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.inboxies.InboxiesTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Inboxies.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Inboxies"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Inboxies:
    build:
      targets:
        Inboxies: all
        InboxiesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InboxiesTests
