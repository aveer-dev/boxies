<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="115" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="2"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Keel (dark charcoal folded underbelly facet) -->
    <polygon points="205,330 172,405 238,360" fill="#1F1F24" stroke="#1F1F24" stroke-width="3"/>
    <!-- Lower / Right wing facet -->
    <polygon points="394,110 205,330 276,408" fill="#F4F4F6" stroke="#2C2C30" stroke-width="8"/>
    <!-- Upper / Left wing facet -->
    <polygon points="394,110 103,222 205,330" fill="#FFFFFF" stroke="#2C2C30" stroke-width="8"/>
    <!-- Spine crease line -->
    <line x1="394" y1="110" x2="205" y2="330" stroke="#2C2C30" stroke-width="8"/>
  </g>
</svg>