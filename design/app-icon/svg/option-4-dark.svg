<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="115" fill="#121214" stroke="#242428" stroke-width="2"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Keel (illuminated white folded underbelly facet) -->
    <polygon points="205,330 172,405 238,360" fill="#F4F4F6" stroke="#F4F4F6" stroke-width="3"/>
    <!-- Lower / Right wing facet -->
    <polygon points="394,110 205,330 276,408" fill="#17171A" stroke="#EDEDF2" stroke-width="8"/>
    <!-- Upper / Left wing facet -->
    <polygon points="394,110 103,222 205,330" fill="#1D1D21" stroke="#EDEDF2" stroke-width="8"/>
    <!-- Spine crease line -->
    <line x1="394" y1="110" x2="205" y2="330" stroke="#EDEDF2" stroke-width="8"/>
  </g>
</svg>