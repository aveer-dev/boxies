<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="115" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="3"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Keel -->
    <polygon points="203,300 179,378 232,328" fill="#1F1F24" stroke="#1F1F24" stroke-width="6"/>
    <!-- Right Wing (subtle shaded facet) -->
    <polygon points="371,128 203,300 275,378" fill="#F4F4F6" stroke="#333336" stroke-width="10"/>
    <!-- Left Wing (pure white illuminated facet) -->
    <polygon points="371,128 107,227 203,300" fill="#FFFFFF" stroke="#333336" stroke-width="10"/>
    <!-- Spine crease line -->
    <line x1="371" y1="128" x2="203" y2="300" stroke="#333336" stroke-width="10"/>
  </g>
</svg>