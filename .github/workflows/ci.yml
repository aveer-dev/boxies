name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  web-worker:
    name: Web + Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The unit tests run TypeScript via `node --experimental-strip-types` (Node >= 22.6).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler types + react-router typegen + tsc -b. Needs no Cloudflare credentials.
      - run: pnpm typecheck

      - run: pnpm test:unit

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # android/gradle/gradle-daemon-jvm.properties pins the Gradle daemon to JetBrains
      # Runtime 21 (Android Studio's JBR). Providing it here avoids Gradle downloading
      # one on every run; the app itself compiles for Java 17.
      #
      # The jetbrains distribution lookup sometimes fails with "No matching version
      # found" (AVE-168), so try it twice and then fall back to Temurin 21. On the
      # fallback, Gradle still runs its daemon on JBR 21: it provisions one from the
      # toolchainUrl entries in gradle-daemon-jvm.properties.
      - id: jbr
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: 21

      - if: steps.jbr.outcome == 'failure'
        run: sleep 20

      - id: jbr-retry
        if: steps.jbr.outcome == 'failure'
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: 21

      - if: steps.jbr.outcome == 'failure' && steps.jbr-retry.outcome == 'failure'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache provider built on actions/cache (the default "enhanced"
          # provider is a commercial service with its own terms of use).
          cache-provider: basic

      # The runner image provides ANDROID_HOME. google-services.json and
      # local.properties are optional: without them FCM is off and
      # GOOGLE_WEB_CLIENT_ID is empty, which is fine for a debug build.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

  ios:
    name: iOS
    # Xcode 27 image (macOS 27, GitHub preview label). Move to `macos-27` once it is GA.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      PROJECT: ios/AgenticInbox/Inboxies.xcodeproj
      SCHEME: Inboxies
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select newest stable Xcode
        run: |
          xcode_app=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1 || true)
          if [ -z "$xcode_app" ]; then
            echo "::error::No stable Xcode found in /Applications"
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version

      # Newest iOS runtime's iPhone that this Xcode can run the scheme on, so the job
      # does not depend on a simulator name that a runner image may not ship.
      - name: Pick iPhone simulator
        id: simulator
        run: |
          dest=$(xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" \
            | sed '/incompatible/,$d' \
            | grep 'platform:iOS Simulator' | grep 'name:iPhone' \
            | sed -E 's/.*[{ ,]id:([^,}]+).*[ ,]OS:([^,}]+).*[ ,]name:([^,}]*[^ ,}]) *}.*/\2 \1 \3/' \
            | sort -V | tail -n 1 || true)
          if [ -z "$dest" ]; then
            echo "::error::No available iPhone simulator for scheme $SCHEME"
            exit 1
          fi
          echo "Using iOS $dest"
          echo "udid=$(echo "$dest" | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build test
