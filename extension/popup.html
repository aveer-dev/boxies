<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Inboxies Private Email</title>
		<style>
			:root {
				--bg: #ffffff;
				--surface: #f7f7f5;
				--ink: #37352f;
				--muted: #787774;
				--line: #e9e9e7;
				--accent: #2383e2;
				--accent-ink: #ffffff;
				--danger: #d44c47;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #191919;
					--surface: #252525;
					--ink: #e6e6e5;
					--muted: #9b9a97;
					--line: #2f2f2f;
					--accent: #529cca;
					--accent-ink: #ffffff;
					--danger: #e16b66;
				}
			}
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				width: 320px;
				background: var(--bg);
				color: var(--ink);
				font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				padding: 16px;
			}
			header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
			header h1 { font-size: 14px; font-weight: 600; }
			.brand-logo { width: 22px; height: 22px; flex-shrink: 0; }
			[hidden] { display: none !important; }
			p.muted, .muted { color: var(--muted); font-size: 12px; }
			label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
			input, select {
				width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
				background: var(--bg); color: var(--ink); font: inherit;
			}
			button {
				font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line);
				background: var(--surface); color: var(--ink); padding: 6px 10px;
			}
			button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
			button.primary {
				width: 100%; margin-top: 12px; padding: 9px; border: none; background: var(--accent);
				color: var(--accent-ink); font-weight: 600;
			}
			button:disabled { opacity: 0.55; cursor: default; }
			button.link { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }
			.result {
				margin-top: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
				border-radius: 6px; background: var(--surface); border: 1px solid var(--line);
			}
			.result .email, .recent .email { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
			.error { color: var(--danger); font-size: 12px; margin-top: 8px; }
			h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; }
			.recent { list-style: none; }
			.recent li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
			.recent .host { font-size: 11px; color: var(--muted); }
			footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
		</style>
	</head>
	<body>
		<header>
			<img class="brand-logo" src="icons/icon-48.png" alt="" />
			<h1>Private email</h1>
		</header>

		<section id="disconnected" hidden>
			<p class="muted">
				Connect to your Inboxies account to create private emails from any sign-up form. The extension can
				create private emails but can't read or send your mail.
			</p>
			<label for="apiUrl">Server</label>
			<input id="apiUrl" type="url" placeholder="https://inboxies.email" />
			<button id="connect" class="primary" type="button">Connect to Inboxies</button>
			<p id="connectError" class="error" role="alert" hidden></p>
		</section>

		<section id="connected" hidden>
			<label for="mailbox">Mailbox</label>
			<select id="mailbox"></select>
			<button id="create" class="primary" type="button">Create private email</button>
			<div id="result" class="result" hidden>
				<span id="resultEmail" class="email"></span>
				<button id="copyResult" type="button">Copy</button>
			</div>
			<p id="createError" class="error" role="alert" hidden></p>

			<h2>Recent</h2>
			<ul id="recent" class="recent"></ul>
			<p id="recentEmpty" class="muted">Nothing yet.</p>

			<footer>
				<span id="server" class="muted"></span>
				<button id="disconnect" class="link" type="button">Disconnect</button>
			</footer>
		</section>

		<script src="popup.js"></script>
	</body>
</html>
